name: Production Environment - Daily Test Run

on:
  # Run daily at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
  
  # Run on push to main/master branch
  push:
    branches:
      - main
      - master
      - framework-Structure
  
  # Run on pull requests
  pull_request:
    branches:
      - main
      - master

jobs:
  prod-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps ${{ matrix.browser }}
    
    - name: Run Playwright tests on PRODUCTION
      run: npx playwright test --project=${{ matrix.browser }}
      env:
        CI: true
        BASE_URL: https://automationexercise.com
        TEST_ENV: production
    
    - name: Upload PRODUCTION test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: prod-playwright-report-${{ matrix.browser }}
        path: playwright-report/
        retention-days: 30
    
    - name: Upload PRODUCTION test traces
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: prod-playwright-traces-${{ matrix.browser }}
        path: test-results/
        retention-days: 30

  notify-prod:
    needs: prod-test
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check PRODUCTION test results
      run: |
        if [ "${{ needs.prod-test.result }}" == "failure" ]; then
          echo "PRODUCTION Tests failed!"
          exit 1
        else
          echo "PRODUCTION Tests passed successfully!"
        fi
